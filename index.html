<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国庆日本旅行规划 · 10/3 - 10/8</title>
<script src="https://webapi.amap.com/maps?v=2.0&key=3b4ce8dfafd2272bfe9dbdd2f7be220a"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1f2733; --sub: #6b7686;
    --line: #e6e9ef; --accent: #d7263d; --accent-bright: #f46036; --accent2: #2b6de0;
  }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh; overflow: hidden; }

  /* 地图加载动画 */
  #mapLoading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; z-index: 1000; font-size: 14px; color: #6b7686;
  }
  #mapLoading::after {
    content: ''; display: block; width: 40px; height: 40px; margin: 10px auto;
    border: 3px solid #f3f3f3; border-top: 3px solid #d7263d;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  header {
    background: linear-gradient(100deg, var(--accent), var(--accent-bright));
    color: #fff; padding: 14px 22px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header .meta { font-size: 12.5px; opacity: .92; }
  .switch { display: flex; background: rgba(255,255,255,.18); border-radius: 10px; padding: 4px; }
  .switch button {
    border: none; background: transparent; color: #fff; padding: 8px 16px;
    font-size: 13.5px; font-weight: 600; border-radius: 7px; cursor: pointer;
    transition: .2s; white-space: nowrap;
  }
  .switch button.active { background: #fff; color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.15); }

  /* 日期按钮组 */
  .day-tabs {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 12px 18px; display: flex; gap: 8px; overflow-x: auto; flex-wrap: wrap;
  }
  .day-tabs::-webkit-scrollbar { height: 4px; }
  .day-tabs::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  .day-tab {
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all .2s;
    font-size: 12.5px; white-space: nowrap; display: flex; align-items: center; gap: 6px;
    font-weight: 500;
  }
  .day-tab:hover { border-color: var(--accent); background: #fef9fa; }
  .day-tab.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(215, 38, 61, 0.3); font-weight: 600;
  }
  .day-tab-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .day-tab.active .day-tab-dot { background: rgba(255,255,255,0.4) !important; }

  .layout { display: flex; height: calc(100vh - 58px - 52px); }
  .sidebar { width: 420px; min-width: 420px; background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 20px 40px; }
  #map { flex: 1; height: 100%; }

  .plan-head { padding: 6px 2px 16px; border-bottom: 2px solid var(--line); margin-bottom: 14px; }
  .plan-head h2 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .plan-head p { font-size: 13px; color: var(--sub); margin-top: 8px; line-height: 1.65; }
  .tag { display: inline-block; background: #fdeaed; color: var(--accent);
    font-size: 11px; padding: 4px 10px; border-radius: 20px; margin: 6px 6px 0 0; font-weight: 600; }

  .info-section {
    background: linear-gradient(135deg, #fff8f0 0%, #fff 100%);
    border: 1px solid #ffe4cc; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
  }
  .info-section h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--ink); }
  .info-section p { font-size: 12.5px; color: var(--sub); line-height: 1.7; margin-bottom: 6px; }
  .info-section strong { color: var(--ink); font-weight: 600; }

  .day { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden;
    transition: box-shadow .2s; }
  .day:hover { box-shadow: 0 4px 16px rgba(0,0,0,.07); }
  .day-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
    background: #fbfbfd; transition: background .2s; }
  .day-head:hover { background: #f5f6f8; }
  .day-head:active { background: #eef0f3; }
  .day-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .day-head .d-date { font-size: 12.5px; color: var(--sub); }
  .day-head .d-title { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .day-head .chev { margin-left: auto; color: var(--sub); font-size: 12px; transition: .2s; }
  .day.open .chev { transform: rotate(90deg); }
  .day-body { display: none; padding: 4px 14px 14px; }
  .day.open .day-body { display: block; }

  .spot { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #f2f3f6; cursor: pointer; }
  .spot:first-child { border-top: none; }
  .spot:hover .s-name { color: var(--accent); }
  .s-num { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; font-weight: 700; }
  .s-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .s-desc { font-size: 12.5px; color: var(--sub); line-height: 1.6; margin-top: 4px; }
  .s-meta { font-size: 11.5px; color: #8b6914; background: #fffbf0; padding: 4px 8px;
    border-radius: 6px; margin-top: 6px; display: inline-block; border: 1px solid #f7e9c8; }
  .stay { font-size: 12px; color: #b3792b; background: #fff6e6; padding: 8px 12px;
    border-radius: 8px; margin-top: 10px; display: inline-block; font-weight: 500; }
  .hint { font-size: 11.5px; color: var(--sub); text-align: center; padding: 10px; }

  /* 地图浮动面板 */
  .map-day-panel {
    position: absolute; top: 20px; right: 20px; width: 340px; max-height: calc(100vh - 160px);
    background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
    border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,.18);
    padding: 20px; overflow-y: auto; z-index: 999;
    display: none; animation: slideIn .3s ease;
  }
  .map-day-panel.active { display: block; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .panel-close { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px;
    border-radius: 50%; background: #f0f1f3; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 18px; color: #6b7686; transition: .2s; }
  .panel-close:hover { background: #e6e9ef; transform: rotate(90deg); }
  .panel-head { padding-right: 34px; margin-bottom: 16px; border-bottom: 2px solid var(--line); padding-bottom: 14px; }
  .panel-head .p-date { font-size: 12.5px; color: var(--sub); }
  .panel-head .p-title { font-size: 17px; font-weight: 700; margin-top: 6px; }
  .panel-spot { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid #f5f6f8; }
  .panel-spot:first-child { border-top: none; }
  .panel-spot .ps-num { width: 26px; height: 26px; border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; flex-shrink: 0; }
  .panel-spot .ps-name { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; }
  .panel-spot .ps-desc { font-size: 12.5px; color: var(--sub); line-height: 1.6; }
  .panel-spot .ps-meta { font-size: 11px; color: #8b6914; background: #fffbf0; padding: 3px 7px;
    border-radius: 5px; margin-top: 5px; display: inline-block; border: 1px solid #f7e9c8; }
  .panel-stay { font-size: 12px; color: #b3792b; background: #fff6e6;
    padding: 10px 14px; border-radius: 8px; margin-top: 14px; font-weight: 500; }

  /* 标记动画 */
  @keyframes markerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .marker-highlight {
    animation: markerPulse 0.6s ease-in-out 2;
  }

  .num-icon { background: transparent; border: none; }
  .num-icon div { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12.5px;
    box-shadow: 0 3px 8px rgba(0,0,0,.35); border: 2px solid #fff; transition: all .25s ease;
  }
  .num-icon div span { transform: rotate(45deg); display: block; }
  .num-icon.highlighted div {
    width: 32px; height: 32px; font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
  }
  .amap-icon-content { width: 34px; height: 34px; }

  /* 移动端视图切换 */
  .view-toggle {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    background: #fff; border-top: 1px solid var(--line); padding: 8px 12px;
    box-shadow: 0 -2px 12px rgba(0,0,0,.08);
  }
  .view-toggle-btns {
    display: flex; gap: 8px; max-width: 500px; margin: 0 auto;
  }
  .view-toggle-btns button {
    flex: 1; border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .2s; display: flex; align-items: center;
    justify-content: center; gap: 6px;
  }
  .view-toggle-btns button.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }

  /* 移动端底部抽屉面板 */
  .mobile-drawer {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
    background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.15);
    max-height: 65vh; overflow-y: auto; transform: translateY(100%);
    transition: transform .3s ease;
  }
  .mobile-drawer.active { transform: translateY(0); }
  .drawer-handle {
    width: 40px; height: 4px; background: #ddd; border-radius: 2px;
    margin: 12px auto 16px; cursor: pointer;
  }
  .drawer-content { padding: 0 18px 24px; }

  @media (max-width: 1100px) { .map-day-panel { width: 300px; right: 12px; top: 12px; } }
  @media (max-width: 800px) {
    header { padding: 12px 16px; }
    header h1 { font-size: 16px; }
    header .meta { font-size: 11.5px; }

    .day-tabs { padding: 10px 14px; gap: 6px; }
    .day-tab { padding: 7px 11px; font-size: 11.5px; }

    .layout { flex-direction: column; height: calc(100vh - 58px - 48px - 56px); }
    .sidebar { width: 100%; min-width: 0; height: 100%; border-right: none; padding: 14px 16px 20px; }
    .sidebar.hide { display: none; }

    #map { height: 100%; }
    #map.hide { display: none; }

    .map-day-panel { display: none !important; }
    .view-toggle { display: block; }
    .mobile-drawer { display: block; }

    .plan-head h2 { font-size: 16px; }
    .info-section { padding: 12px 14px; font-size: 12.5px; }
    .day-head { padding: 11px 0; }
    .d-date { font-size: 12.5px; }
    .d-title { font-size: 14px; }
    .spot { padding: 10px 0; }
    .s-name { font-size: 13.5px; }
    .s-desc { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>🇯🇵 国庆日本旅行规划 · 京都 & 大阪</h1>
    <div class="meta">10/3 下午4-5点抵达 · 10/8 下午1-3点飞香港 · 5 晚 6 天 · 关西机场 (KIX)</div>
  </div>
</header>

<div class="day-tabs" id="dayTabs"></div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div id="map" class="hide" style="position: relative;">
    <div id="mapLoading">加载地图中...</div>
    <div class="map-day-panel" id="mapPanel">
      <div class="panel-close" onclick="closeDayPanel()">×</div>
      <div id="panelContent"></div>
    </div>
  </div>
</div>

<div class="mobile-drawer" id="mobileDrawer">
  <div class="drawer-handle" onclick="closeMobileDrawer()"></div>
  <div class="drawer-content" id="drawerContent"></div>
</div>

<div class="view-toggle">
  <div class="view-toggle-btns">
    <button id="btnList" class="active" onclick="switchView('list')">📋 行程列表</button>
    <button id="btnMap" onclick="switchView('map')">🗺️ 地图视图</button>
  </div>
</div>

<script>
const DAY_COLORS = ['#d7263d','#f46036','#e6a817','#2ca05a','#2b6de0','#7d4fd0'];

const plan = {
  name: '京都 & 大阪 6日游',
  airport: '关西国际机场 (KIX)',
  intro: '住在京都国立博物馆一带（京阪七条站），清水寺步行可达、伏见稻荷京阪直达，三晚不挪窝。后半程移到大阪玩环球影城，最后从难波去机场只要38分钟。',
  tags: ['七条住三晚', '宇治抹茶圣地', '奈良小鹿', '伏见稻荷·岚山', '环球影城/海游馆'],
  budget: '💰 预算参考：住宿约 ¥600-1,000/晚，关西周游券 ¥2,800-5,500，门票+餐饮约 ¥6,000-12,000/天（含USJ）',
  transport: '🚄 交通：落地办 ICOCA（地铁JR便利店通刷）。住七条建议配<strong>京阪线</strong>——伏见稻荷2站、祇园四条2站、大阪淀屋桥直达，比市巴士准时。清水寺/三十三间堂步行可达，不用买巴士一日券。',
  emergency: '🆘 紧急联系：中国驻大阪总领馆 06-6445-9481 | 日本急救 119 | 警察 110',
  days: [
    { date: '10/3 周六', title: '抵达 · 入住七条',
      stay: '住宿：京都七条(国立博物馆一带)',
      spots: [
        {n:'关西国际机场 KIX', c:[34.4320,135.2304], d:'下午4-5点落地。出关+取行李约40分钟，5:30前能上车。HARUKA特急约75分钟到京都站。', m:'HARUKA ¥3,430'},
        {n:'京都站 → 七条', c:[34.9859,135.7589], d:'京都站转市バス206/208号到「博物馆三十三间堂前」约10分钟，或JR转京阪七条站。约7点到酒店。', m:'市巴士 ¥230'},
        {n:'七条 · 晚餐', c:[34.9906,135.7729], d:'酒店附近觅食。七条通一带有拉面、居酒屋；想热闹可坐京阪2站到祇园四条。落地第一晚别安排太满。', m:'晚餐 ¥1,500'},
      ]},
    { date: '10/4 周日', title: '宇治抹茶 & 奈良萌鹿',
      stay: '住宿：京都七条',
      spots: [
        {n:'宇治平等院', c:[34.8893,135.8076], d:'七条走到京都站坐JR奈良线约20分钟，或京阪七条站直接南下。10円硬币背面的凤凰堂，水池倒影是重点。9:00到人少。', m:'JR ¥240 + 门票 ¥600'},
        {n:'宇治抹茶巡礼', c:[34.8907,135.8080], d:'中村藤吉本店的生茶果冻和抹茶芭菲、伊藤久右卫门，沿宇治川走到宇治桥。这站慢慢逛，别赶。', m:'抹茶 ¥1,500'},
        {n:'东大寺', c:[34.6889,135.8398], d:'宇治沿JR奈良线继续南下约40分钟到奈良。世界最大木造建筑，里面那尊大佛值得站着看一会儿。', m:'JR ¥510 + 门票 ¥600'},
        {n:'奈良公园(喂鹿)', c:[34.6851,135.8430], d:'一千多头鹿散养在这儿。鹿仙贝¥200一份，拿出来会被围住，举高快速喂完是诀窍。会鞠躬的鹿真的存在。留1-1.5小时。', m:'鹿仙贝 ¥200'},
        {n:'奈良町 → 返京都', c:[34.6799,135.8301], d:'傍晚逛奈良町，古民家改的餐厅，柿叶寿司、大和茶。晚餐后JR回京都约45分钟，七条下车。', m:'晚餐 ¥1,500'},
      ]},
    { date: '10/5 周一', title: '伏见稻荷 · 岚山 · 东山',
      stay: '住宿：京都七条',
      spots: [
        {n:'伏见稻荷大社', c:[34.9671,135.7727], d:'京阪七条站南下2站到伏见稻荷，10分钟就到——住这儿最大的便利。7:00-8:00去基本没人，是全天唯一能拍空镜的窗口。到山顶往返2小时，只到四辻折返也够看。', m:'京阪 ¥210'},
        {n:'岚山 · 竹林 & 渡月桥', c:[35.0170,135.6717], d:'从伏见稻荷横穿到岚山约50分钟，是今天唯一的长途。嵯峨野竹林、渡月桥、天龙寺庭园。午餐这边的汤豆腐配得上环境。', m:'天龙寺 ¥500 / 午餐 ¥1,800'},
        {n:'清水寺', c:[34.9948,135.7850], d:'下午回东山。从七条酒店步行20分钟或巴士2站就能到，机动性很好。清水舞台俯瞰、音羽瀑布。想穿和服在这一带租。', m:'门票 ¥400 / 和服 ¥3,850'},
        {n:'八坂神社 & 鸭川', c:[35.0036,135.7785], d:'二年坂三年坂快速穿过，人多且店铺同质。重点留给鸭川：四条大桥边有台阶下到河滩，坐在跳石上看日落。回程京阪祇园四条到七条2站。', m:'免费'},
      ]},
    { date: '10/6 周二', title: '七条散步 → 大阪',
      stay: '住宿：大阪难波周边',
      spots: [
        {n:'三十三间堂', c:[34.9879,135.7717], d:'酒店步行3-5分钟。1001尊千手观音列在120米长廊里，是那种照片拍不出来的震撼。8:30开门，一小时够。', m:'门票 ¥600'},
        {n:'京都国立博物馆', c:[34.9902,135.7729], d:'就在隔壁。明治砖造本馆很好看，常设展一小时左右。行李可先寄存在酒店或京都站。⚠周一休馆，周二正常开。', m:'常设展 ¥700'},
        {n:'移动大阪', c:[34.6687,135.5013], d:'午后取行李，京阪七条直达淀屋桥或JR到大阪站，约50分钟到难波。入住后放行李。', m:'京阪 ¥430'},
        {n:'大阪城 & 天守阁', c:[34.6873,135.5259], d:'傍晚游大阪城。登天守俯瞰，护城河与西之丸庭园在夕阳下比正午好看。⚠天守17:00停止入场。', m:'天守阁 ¥600'},
        {n:'道顿堀 & 心斋桥', c:[34.6687,135.5013], d:'晚上逛道顿堀，格力高招牌、章鱼烧、一兰拉面。心斋桥筋顺路，先摸清哪家有什么，10/8再下手。', m:'晚餐 ¥2,000'},
      ]},
    { date: '10/7 周三', title: '环球影城 或 海游馆',
      stay: '住宿：大阪难波周边',
      spots: [
        {n:'USJ 环球影城(推荐)', c:[34.6654,135.4322], d:'地铁+JR约30分钟到ユニバーサルシティ站。哈利波特、马里奥、小黄人，建议购买快速通行券(Express Pass ¥7,800-14,800)，玩一整天。', m:'门票 ¥8,900起 + 快票 ¥7,800起'},
        {n:'(或)海游馆', c:[34.6546,135.4289], d:'若不想刺激项目，可选海游馆。世界最大水族馆之一，鲸鲨超震撼，大阪港旁边还有摩天轮（¥1,000）。', m:'门票 ¥2,700 + 摩天轮 ¥1,000'},

let map, allMarkers = [], polylines = [], currentHighlightDay = null;
let markersByDay = [];

function initMap(){
  map = new AMap.Map('map', {
    zoom: 7,
    center: [135.5, 35],
    mapStyle: 'amap://styles/normal',
    viewMode: '2D',
    resizeEnable: true
  });

  // 地图加载完成后隐藏loading
  map.on('complete', function(){
    const loading = document.getElementById('mapLoading');
    if(loading) loading.style.display = 'none';
  });
}

function createMarkerIcon(num, color, highlighted = false, dimmed = false){
  const size = highlighted ? 32 : 26;
  const shadowSize = highlighted ? '0 4px 12px' : '0 3px 6px';
  const opacity = dimmed ? 0.3 : 1;
  const highlightClass = highlighted ? ' class="marker-highlight"' : '';
  return `<div class="num-icon${highlighted ? ' highlighted' : ''}" style="opacity:${opacity}"${highlightClass}><div style="background:${color};width:${size}px;height:${size}px;box-shadow:${shadowSize} rgba(0,0,0,.4)"><span>${num}</span></div></div>`;
}

function renderMap(p){
  allMarkers.forEach(m => m.setMap(null));
  polylines.forEach(p => p.setMap(null));
  allMarkers = [];
  polylines = [];
  markersByDay = [];
  currentHighlightDay = null;

  const allPts = [];
  p.days.forEach((day, di) => {
    const color = DAY_COLORS[di % DAY_COLORS.length];
    const dayPts = [];
    markersByDay[di] = [];

    day.spots.forEach((s, si) => {
      const pos = [s.c[1], s.c[0]];
      dayPts.push(pos);
      allPts.push(pos);

      const marker = new AMap.Marker({
        position: pos,
        content: createMarkerIcon(si+1, color, false),
        offset: new AMap.Pixel(-13, -26),
        map: map,
        extData: { dayIndex: di, spotIndex: si }
      });

      const infoWindow = new AMap.InfoWindow({
        content: `<div class="amap-info-content"><b>${day.date} · 第${di+1}天</b><b>${s.n}</b>${s.d}${s.m ? '<br><span style="color:#8b6914;font-size:11.5px">💴 ' + s.m + '</span>' : ''}</div>`,
        offset: new AMap.Pixel(0, -26)
      });

      marker.on('click', () => {
        infoWindow.open(map, pos);
      });

      allMarkers.push(marker);
      markersByDay[di].push({ marker, color, spotData: s, dayData: day });
    });

    if (dayPts.length > 1){
      const polyline = new AMap.Polyline({
        path: dayPts,
        strokeColor: color,
        strokeWeight: 3,
        strokeOpacity: 0.65,
        strokeStyle: 'dashed',
        showDir: true,  // 显示方向箭头
        dirColor: color,  // 箭头颜色
        map: map,
        extData: { dayIndex: di }
      });
      polylines.push(polyline);
    }
  });

  // 手机上地图初始隐藏，此时 setFitView 算不出可视范围，留给 switchView 处理
  if (allPts.length > 0 && !(isMobile() && currentView === 'list')) {
    map.setFitView(allMarkers, false, [80, 80, 80, 80]);
  }
}

function highlightDay(dayIndex) {
  if (dayIndex === currentHighlightDay) {
    showAllDays();
    return;
  }

  currentHighlightDay = dayIndex;
  const day = plan.days[dayIndex];
  const color = DAY_COLORS[dayIndex % DAY_COLORS.length];

  setActiveTab(dayIndex);

  markersByDay.forEach((dayMarkers, di) => {
    const isHighlighted = di === dayIndex;
    const isDimmed = !isHighlighted;

    dayMarkers.forEach(({marker}, si) => {
      const markerColor = isHighlighted ? color : '#999';
      marker.setContent(createMarkerIcon(si+1, markerColor, isHighlighted, isDimmed));
    });
  });

  polylines.forEach((polyline) => {
    const di = polyline.getExtData().dayIndex;
    if (di === dayIndex) {
      polyline.setOptions({ strokeWeight: 5, strokeOpacity: 0.9, strokeColor: color, showDir: true, dirColor: color });
    } else {
      polyline.setOptions({ strokeColor: '#ccc', strokeWeight: 2, strokeOpacity: 0.3, showDir: false });
    }
  });

  if (isMobile()) {
    // 手机上用底部抽屉，并切到地图才能看到高亮
    showMobileDrawer(day, dayIndex, color);
    if (currentView === 'list') switchView('map');
  } else {
    showDayPanel(day, dayIndex, color);
  }

  const dayMarkers = markersByDay[dayIndex].map(m => m.marker);
  if (dayMarkers.length > 0) {
    map.setFitView(dayMarkers, false, isMobile() ? [50, 50, 50, 50] : [100, 100, 100, 100]);
  }
}

function resetHighlight() {
  currentHighlightDay = null;

  markersByDay.forEach((dayMarkers, di) => {
    const color = DAY_COLORS[di % DAY_COLORS.length];
    dayMarkers.forEach(({marker}, si) => {
      marker.setContent(createMarkerIcon(si+1, color, false, false));
    });
  });

  polylines.forEach((polyline) => {
    const di = polyline.getExtData().dayIndex;
    const color = DAY_COLORS[di % DAY_COLORS.length];
    polyline.setOptions({ strokeColor: color, strokeWeight: 3, strokeOpacity: 0.65, showDir: true, dirColor: color });
  });

  if (allMarkers.length > 0) {
    map.setFitView(allMarkers, false, [80, 80, 80, 80]);
  }
}

function showDayPanel(day, dayIndex, color) {
  const panel = document.getElementById('mapPanel');
  const content = document.getElementById('panelContent');

  let html = `<div class="panel-head">
    <div class="p-date">${day.date}</div>
    <div class="p-title">${day.title}</div>
  </div>`;

  day.spots.forEach((s, si) => {
    html += `<div class="panel-spot" onclick="flyTo(${s.c[0]},${s.c[1]})">
      <span class="ps-num" style="background:${color}">${si+1}</span>
      <div>
        <div class="ps-name">${s.n}</div>
        <div class="ps-desc">${s.d}</div>
        ${s.m ? '<div class="ps-meta">💴 ' + s.m + '</div>' : ''}
      </div>
    </div>`;
  });

  html += `<div class="panel-stay">🛏 ${day.stay}</div>`;

  content.innerHTML = html;
  panel.classList.add('active');
}

function closeDayPanel() {
  document.getElementById('mapPanel').classList.remove('active');
}

function showAllDays(){
  resetHighlight();
  closeDayPanel();
  closeMobileDrawer();
  setActiveTab('all');
}

function renderDayTabs(p){
  const tabs = document.getElementById('dayTabs');
  let html = `<div class="day-tab" data-tab="all" onclick="showAllDays()">🗾 全部行程</div>`;
  p.days.forEach((day, di) => {
    const color = DAY_COLORS[di % DAY_COLORS.length];
    // 提取住宿地点简称
    let stayCity = '';
    if (day.stay.includes('七条')) stayCity = '住七条';
    else if (day.stay.includes('京都')) stayCity = '住京都';
    else if (day.stay.includes('大阪') || day.stay.includes('难波')) stayCity = '住大阪';
    else if (day.stay.includes('飞香港') || day.stay.includes('返程') || day.stay.includes('起飞')) stayCity = '返程日';

    html += `<div class="day-tab" data-tab="${di}" onclick="highlightDay(${di})">
      <span class="day-tab-dot" style="background:${color}"></span>${day.date.split(' ')[0]} 第${di+1}天${stayCity ? ' · ' + stayCity : ''}
    </div>`;
  });
  tabs.innerHTML = html;
  setActiveTab('all');
}

function setActiveTab(tabKey){
  document.querySelectorAll('.day-tab').forEach(t => {
    t.classList.toggle('active', t.getAttribute('data-tab') === String(tabKey));
  });
}

function renderSidebar(p){
  const sb = document.getElementById('sidebar');
  let html = `<div class="plan-head"><h2>${p.name}</h2>
    <p>✈️ 进出机场：${p.airport}</p>
    <p>${p.intro}</p>
    <div>${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`;

  html += `<div class="info-section">
    <h3>💡 实用信息</h3>
    <p>${p.budget}</p>
    <p>${p.transport}</p>
    <p>${p.emergency}</p>
  </div>`;

  p.days.forEach((day, di) => {
    const color = DAY_COLORS[di % DAY_COLORS.length];
    html += `<div class="day open" data-day="${di}">
      <div class="day-head" onclick="onDayHeadClick(event, ${di})">
        <span class="day-dot" style="background:${color}"></span>
        <div><div class="d-date">${day.date}</div><div class="d-title">${day.title}</div></div>
        <span class="chev">▶</span>
      </div>
      <div class="day-body">`;
    day.spots.forEach((s, si) => {
      html += `<div class="spot" onclick="flyTo(${s.c[0]},${s.c[1]})">
        <span class="s-num" style="background:${color}">${si+1}</span>
        <div>
          <div class="s-name">${s.n}</div>
          <div class="s-desc">${s.d}</div>
          ${s.m ? '<div class="s-meta">💴 ' + s.m + '</div>' : ''}
        </div>
      </div>`;
    });
    html += `<div class="stay">🛏 ${day.stay}</div></div></div>`;
  });
  html += `<div class="hint">💡 点击日期标题可在地图高亮当天行程 · 点击箭头可折叠</div>`;
  sb.innerHTML = html;
}

function onDayHeadClick(event, dayIndex) {
  if (event.target.classList.contains('chev')) {
    toggleDay(dayIndex);
    return;
  }
  highlightDay(dayIndex);
}

function toggleDay(di){
  document.querySelector(`.day[data-day="${di}"]`).classList.toggle('open');
}

function flyTo(lat,lng){
  map.setZoomAndCenter(14, [lng, lat], true, 800);
  // 手机上点景点自动切到地图，否则看不到跳转结果
  if (isMobile() && currentView === 'list') switchView('map');
}

// ---- 移动端视图切换 ----
let currentView = 'list';

function isMobile(){ return window.innerWidth <= 800; }

function switchView(view){
  currentView = view;
  const sidebar = document.getElementById('sidebar');
  const mapEl = document.getElementById('map');

  sidebar.classList.toggle('hide', view === 'map');
  mapEl.classList.toggle('hide', view === 'list');
  document.getElementById('btnList').classList.toggle('active', view === 'list');
  document.getElementById('btnMap').classList.toggle('active', view === 'map');

  if (view === 'map') {
    // 地图在隐藏状态下初始化会尺寸错乱，切回来要重算
    setTimeout(() => {
      map.resize();
      const target = currentHighlightDay !== null
        ? markersByDay[currentHighlightDay].map(m => m.marker)
        : allMarkers;
      if (target.length) map.setFitView(target, false, [60, 60, 60, 60]);
    }, 60);
  } else {
    closeMobileDrawer();
  }
}

function showMobileDrawer(day, dayIndex, color){
  const content = document.getElementById('drawerContent');
  let html = `<div class="panel-head">
    <div class="p-date">${day.date}</div>
    <div class="p-title">${day.title}</div>
  </div>`;

  day.spots.forEach((s, si) => {
    html += `<div class="panel-spot" onclick="flyTo(${s.c[0]},${s.c[1]})">
      <span class="ps-num" style="background:${color}">${si+1}</span>
      <div>
        <div class="ps-name">${s.n}</div>
        <div class="ps-desc">${s.d}</div>
        ${s.m ? '<div class="ps-meta">💴 ' + s.m + '</div>' : ''}
      </div>
    </div>`;
  });

  html += `<div class="panel-stay">🛏 ${day.stay}</div>`;
  content.innerHTML = html;
  document.getElementById('mobileDrawer').classList.add('active');
}

function closeMobileDrawer(){
  document.getElementById('mobileDrawer').classList.remove('active');
}

// 转屏时重置到桌面布局，避免留下 hide 状态
window.addEventListener('resize', () => {
  if (!isMobile()) {
    document.getElementById('sidebar').classList.remove('hide');
    document.getElementById('map').classList.remove('hide');
    closeMobileDrawer();
    if (map) map.resize();
  } else if (currentView === 'map') {
    document.getElementById('sidebar').classList.add('hide');
  }
});

initMap();
renderDayTabs(plan);
renderSidebar(plan);
renderMap(plan);
</script>
</body>
</html>
